<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Search</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar-container">
    <!-- En-tete -->
    <div class="sidebar-header">
      <h1>RAG Search</h1>
      <p class="subtitle">Recherche intelligente dans vos emails</p>
    </div>

    <!-- Onglets -->
    <div class="tabs">
      <button class="tab-button active" data-tab="search">Recherche</button>
      <button class="tab-button" data-tab="logs">Logs</button>
    </div>

    <!-- Contenu des onglets -->
    <div class="tab-content">
      <!-- Onglet Recherche -->
      <div id="search" class="tab-pane active">
        <div class="search-section">
          <div class="search-box">
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Posez votre question..."
              autocomplete="off"
            >
            <button id="searchButton">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </div>
          
          <div class="search-options">
            <label>
              <input type="checkbox" id="useRAGCheckbox"> Utiliser RAG
            </label>
            <select id="llmTypeSelect">
              <option value="api_externe">API Externe (Mistral)</option>
              <option value="local">Local (Ollama)</option>
            </select>
          </div>
        </div>

        <div class="indexation-status">
          <div class="status-item">
            <span class="status-label">Emails indexés:</span>
            <span id="indexedCount">0</span>
          </div>
          <div class="status-item">
            <span class="status-label">Dernière indexation:</span>
            <span id="lastIndexation">Jamais</span>
          </div>
          <div class="status-item">
            <span class="status-label">Indexation en cours:</span>
            <span id="isIndexing">Non</span>
          </div>
        </div>

        <div class="actions">
          <button id="indexAllButton" class="btn btn-primary">
            Indexer tous les emails
          </button>
          <button id="indexModifiedButton" class="btn btn-secondary">
            Indexer les modifiés
          </button>
          <button id="clearIndexButton" class="btn btn-danger">
            Vider l'index
          </button>
        </div>

        <div class="results-section">
          <h3>Résultats</h3>
          <div id="resultsContainer">
            <p class="no-results">Aucun résultat pour le moment.</p>
          </div>
        </div>

        <div class="rag-answer-section" id="ragAnswerSection" style="display: none;">
          <h3>Réponse RAG</h3>
          <div id="ragAnswer">
            <!-- La réponse sera affichée ici -->
          </div>
          <div class="answer-meta">
            <span id="answerModel"></span>
            <span id="answerDuration"></span>
          </div>
        </div>

        <div class="rag-context-section" id="ragContextSection" style="display: none;">
          <h3>Emails utilisés pour la réponse</h3>
          <div id="ragContextEmails">
            <!-- Les emails du contexte seront affichés ici -->
          </div>
        </div>
      </div>

      <!-- Onglet Logs -->
      <div id="logs" class="tab-pane">
        <div class="logs-section">
          <div class="logs-actions">
            <button id="refreshLogsButton" class="btn btn-small">
              Rafraîchir
            </button>
            <button id="clearLogsButton" class="btn btn-small btn-danger">
              Effacer les logs
            </button>
            <button id="exportLogsButton" class="btn btn-small">
              Exporter
            </button>
          </div>
          
          <div class="logs-container">
            <pre id="logsContent">Chargement des logs...</pre>
          </div>
        </div>
      </div>
    </div>

    <!-- Indicateur de chargement -->
    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
      <div class="spinner"></div>
      <span id="loadingText">Chargement...</span>
    </div>

    <!-- Notifications -->
    <div id="notificationContainer" class="notification-container"></div>
  </div>

  <script src="sidebar.js" type="module"></script>
</body>
</html>
